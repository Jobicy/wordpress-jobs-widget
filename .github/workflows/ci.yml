name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: find jobicy-remote-jobs-widget tests -name '*.php' -exec php -l {} \;
      - run: php tests/widget.php
      - run: python3 build.py
      - uses: actions/upload-artifact@v4
        with:
          name: jobicy-wordpress-plugin
          path: dist/jobicy-remote-jobs-widget.zip
